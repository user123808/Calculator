<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulačka</title>


    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="calculator">


        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button onclick="cleardisplay()" onclick="appendNumber('Space')"class="atd">C</button>
            <button onclick="deletelast()"onclick="appendNumber('Backspace')" class="atd">⌫</button>
            <button onclick="addtoDisplay('/')"onclick="appendNumber('/')" class="atd">÷</button>
            <button onclick="addtoDisplay('*')"onclick="appendNumber('*')" class="atd">×</button>

            <button onclick="addtoDisplay('7')"onclick="appendNumber('7')" class="number">7</button>
            <button onclick="addtoDisplay('8')"onclick="appendNumber('8')" class="number">8</button>
            <button onclick="addtoDisplay('9')"onclick="appendNumber('9')" class="number">9</button>
            <button onclick="addtoDisplay('-')"onclick="appendNumber('-')" class="atd">−</button>

            <button onclick="addtoDisplay('4')"onclick="appendNumber('4')" class="number">4</button>
            <button onclick="addtoDisplay('5')"onclick="appendNumber('5')" class="number">5</button>
            <button onclick="addtoDisplay('6')"onclick="appendNumber('6')" class="number">6</button>
            <button onclick="addtoDisplay('+')"onclick="appendNumber('+')" class="atd">+</button>

            <button onclick="addtoDisplay('1')"onclick="appendNumber('1')" class="number">1</button>
            <button onclick="addtoDisplay('2')"onclick="appendNumber('2')" class="number">2</button>
            <button onclick="addtoDisplay('3')"onclick="appendNumber('3')" class="number">3</button>
            <button onclick="calculate()"onclick="appendNumber('')" class="eq">=</button>

            <button onclick="addtoDisplay('0')"onclick="appendNumber('0')" class="zero" id="b0">0</button>
            <button onclick="addtoDisplay('.')"onclick="appendNumber(',')" id="b0">.</button>
            <button onclick="changecalculator()"onclick="appendNumber('')" class="C">O</button>
        </div>

    </div>


    <script src="index.js"></script>

</body>
</html>
